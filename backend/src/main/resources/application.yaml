spring:
  application:
    name: blog-service
  profiles:
    active: dev
  multipart:
    max-file-size: 1MB
    max-request-size: 10MB
    file-size-threshold: 2KB
  sql:
    init:
      mode: always
      platform: mysql
  jpa:
    defer-datasource-initialization: true

---
app:
  host: http://localhost:8080

spring:
  config:
    activate:
      on-profile: test
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;mode=mysql
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create
    open-in-view: false
    show-sql: true
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
      - org.redisson.spring.starter.RedissonAutoConfiguration

file-upload:
  member:
    base-url: /api/v1/member-profiles/
    default-image:
      file: default.png
      path: classpath:/static/images/member/default.png
    storage: D:/upload/member/
  post:
    base-url: /api/v1/post-images/
    default-image:
      file: default.png
      path: classpath:/static/images/post/default.png
    storage: D:/upload/post/

management:
  endpoints:
    web:
      exposure:
        include: "health,metrics,info"
  endpoint:
    health:
      show-details: always

jwt:
  secret-key: MTIzNDU2Nzg5MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTI=
  access-token:
    expiration: 600000     # 10분 (600000) → 1000 * 60 * 10 (ms)
  refresh-token:
    expiration: 86400000   # 1일 (86400000) → 1000 * 60 * 60 * 24 * 1 (ms)

